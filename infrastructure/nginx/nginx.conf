# NewsCrawl internal application gateway.
# Central Traefik terminates TLS and routes both public hostnames here; this
# Nginx fans out to the web and API upstreams by Host header and handles
# buffering, body limits, keepalive, and static asset caching.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Traefik fronts us: log in a compact format, trust its X-Forwarded-* set.
    log_format gateway '$remote_addr "$host" "$request" $status $body_bytes_sent '
                       '$request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log gateway;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    upstream web_upstream {
        server web:3000;
        keepalive 16;
    }

    upstream api_upstream {
        server api:8000;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # ── Dashboard: newscrawl.musfiqdehan.com ─────────────────────────────────
    server {
        listen 80;
        server_name newscrawl.musfiqdehan.com;

        client_max_body_size 2m;

        # Immutable Next.js build assets — cache hard at the gateway.
        location /_next/static/ {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }
    }

    # ── API: newscrawl-api.musfiqdehan.com ───────────────────────────────────
    server {
        listen 80;
        server_name newscrawl-api.musfiqdehan.com;

        client_max_body_size 5m;
        proxy_buffering on;

        location / {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection "";
            # Semantic search embeds the query on first call (model load).
            proxy_read_timeout 120s;
        }

        # Never expose raw metrics publicly; Prometheus scrapes internally.
        location /api/v1/metrics {
            deny all;
        }
    }

    # Default: reject requests for unknown hostnames.
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}

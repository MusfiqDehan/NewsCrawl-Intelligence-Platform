# NewsCrawl Redis configuration
# Redis holds queues, locks, heartbeats, and rate-limit state — losing it must
# never lose articles (PostgreSQL is the source of truth), but persisting the
# streams avoids re-processing churn on restart.

# ── Persistence ───────────────────────────────────────────────────────────────
# AOF with per-second fsync: at most 1s of queue state lost on crash.
appendonly yes
appendfsync everysec
# RDB snapshots as a secondary safety net.
save 900 1
save 300 100

# ── Memory ────────────────────────────────────────────────────────────────────
# Never evict queue data silently; fail loudly instead.
maxmemory-policy noeviction

# ── Reliability ───────────────────────────────────────────────────────────────
tcp-keepalive 60
timeout 0

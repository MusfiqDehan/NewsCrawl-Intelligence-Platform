[project]
name = "newscrawl-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts: queue messages, enums, and domain value objects"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newscrawl_contracts"]

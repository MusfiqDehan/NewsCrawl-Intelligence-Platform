# ─────────────────────────────────────────────────────────────────────────────
# NewsCrawl Intelligence Platform — PRODUCTION stack
#
# Edge: the central Traefik deployment (external `traefik_proxy` network)
# terminates TLS for newscrawl.musfiqdehan.com / newscrawl-api.musfiqdehan.com
# and routes both hosts to the internal Nginx gateway. Only Nginx joins the
# proxy network; everything else stays on the private `newscrawl_internal`
# network.
#
# Usage:
#   cp env.prod.example env.prod   # fill in real secrets
#   make prod-build && make prod-migrate && make deploy-prod
# ─────────────────────────────────────────────────────────────────────────────

name: newscrawl

services:
  # ── Edge gateway (the only service on traefik_proxy) ────────────────────────
  nginx:
    image: nginx:1.29-alpine
    container_name: newscrawl-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - traefik_proxy
      - internal
    depends_on:
      - api
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Dashboard
      - "traefik.http.routers.newscrawl-web.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.newscrawl-web.entrypoints=websecure"
      - "traefik.http.routers.newscrawl-web.tls=true"
      - "traefik.http.routers.newscrawl-web.middlewares=security-headers@file,compress@file"
      - "traefik.http.routers.newscrawl-web.service=newscrawl-gateway"
      # API
      - "traefik.http.routers.newscrawl-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.newscrawl-api.entrypoints=websecure"
      - "traefik.http.routers.newscrawl-api.tls=true"
      - "traefik.http.routers.newscrawl-api.middlewares=security-headers@file,compress@file,api-ratelimit@file"
      - "traefik.http.routers.newscrawl-api.service=newscrawl-gateway"
      # Shared upstream: Nginx disambiguates by Host header
      - "traefik.http.services.newscrawl-gateway.loadbalancer.server.port=80"

  # ── Application plane ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    image: newscrawl-api:latest
    container_name: newscrawl-api
    restart: unless-stopped
    env_file: env.prod
    environment:
      # Query encode reuses the embedding worker's in-process BGE-M3 (no torch in API).
      EMBEDDING_SERVICE_URL: http://processor-embedding:8081
    volumes:
      # Keep public routes / HTTP embed client in sync without full image rebuilds.
      - ./apps/api/newscrawl_api:/app/apps/api/newscrawl_api:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      processor-embedding:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    image: newscrawl-web:latest
    container_name: newscrawl-web
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - api

  crawler:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.crawler
    image: newscrawl-crawler:latest
    restart: unless-stopped
    # Fair scheduling: rotate sources after a capped page budget so one fat
    # frontier cannot starve every other outlet.
    command:
      [
        "python",
        "-m",
        "newscrawl_crawler.run_worker",
        "--max-pages",
        "25",
        "--batch-size",
        "10",
        "--interval",
        "5",
      ]
    env_file: env.prod
    volumes:
      # Hot-deploy crawl plane without rebuilding Playwright image.
      - ./apps/crawler/newscrawl_crawler:/app/apps/crawler/newscrawl_crawler
      - ./packages/contracts/newscrawl_contracts:/app/packages/contracts/newscrawl_contracts:ro
      - ./apps/api/newscrawl_api:/app/apps/api/newscrawl_api:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2g

  processor-cleaning:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.processor
    image: newscrawl-processor:latest
    restart: unless-stopped
    command: ["python", "-m", "newscrawl_processor.run_worker"]
    env_file: env.prod
    volumes:
      - ./apps/processor/newscrawl_processor:/app/apps/processor/newscrawl_processor
      - ./apps/api/newscrawl_api:/app/apps/api/newscrawl_api:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  processor-llm:
    image: newscrawl-processor:latest
    restart: unless-stopped
    # Free-tier Gemini is ~5 RPM; keep concurrency at 1 to avoid immediate 429s.
    command: ["python", "-m", "newscrawl_processor.run_llm_worker", "--batch-size", "1"]
    env_file: env.prod
    networks:
      - internal
    depends_on:
      processor-cleaning:
        condition: service_started
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully

  processor-embedding:
    image: newscrawl-processor:latest
    restart: unless-stopped
    command: ["python", "-m", "newscrawl_processor.run_embedding_worker"]
    env_file: env.prod
    environment:
      # Worker must load the model locally (encode server lives here).
      EMBEDDING_SERVICE_URL: ""
    volumes:
      - hf_cache:/home/newscrawl/.cache/huggingface
      # Encode HTTP server + worker code without full processor image rebuild.
      - ./apps/processor/newscrawl_processor:/app/apps/processor/newscrawl_processor
      - ./apps/api/newscrawl_api:/app/apps/api/newscrawl_api:ro
    networks:
      - internal
    depends_on:
      processor-cleaning:
        condition: service_started
      hf-cache-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 4g

  processor-retention:
    image: newscrawl-processor:latest
    restart: unless-stopped
    # Purges articles older than ARTICLE_RETENTION_HOURS every ARTICLE_RETENTION_INTERVAL_HOURS.
    command: ["python", "-m", "newscrawl_processor.run_retention_worker"]
    env_file: env.prod
    volumes:
      - ./apps/processor/newscrawl_processor:/app/apps/processor/newscrawl_processor
      - ./apps/api/newscrawl_api:/app/apps/api/newscrawl_api:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m

  # ── State plane (never exposed to traefik_proxy) ────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: newscrawl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_backups:/backups
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m

  redis:
    image: redis:8-alpine
    container_name: newscrawl-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: newscrawl-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - internal

  # One-shot bucket bootstrap (required before crawlers can store raw HTML).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      i=0;
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        i=$$((i+1));
        if [ $$i -ge 30 ]; then echo 'minio not ready' >&2; exit 1; fi;
        sleep 2;
      done;
      mc mb --ignore-existing local/$${BUCKET};
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      BUCKET: ${S3_BUCKET_RAW_HTML:-newscrawl-raw-html}
    networks:
      - internal
    restart: "no"

  # Ensure the HuggingFace cache volume is writable by the processor user (uid 999).
  hf-cache-init:
    image: busybox:1.37
    user: "0"
    volumes:
      - hf_cache:/cache
    command: ["sh", "-c", "mkdir -p /cache && chown -R 999:999 /cache"]
    restart: "no"

  # Local open-weight LLM (Ollama). Used as Gemini fallback on 429/expiry, or
  # as the sole provider when LLM_PROVIDER=ollama (no cloud API keys needed).
  ollama:
    image: ollama/ollama:latest
    container_name: newscrawl-ollama
    restart: unless-stopped
    environment:
      # One model at a time; keep loaded between requests on CPU hosts.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    # Contabo VPS is CPU-only; keep headroom for postgres + embeddings.
    deploy:
      resources:
        limits:
          memory: 5g
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Pull the configured model once Ollama is up (idempotent).
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      i=0;
      until ollama list >/dev/null 2>&1; do
        i=$$((i+1));
        if [ $$i -ge 60 ]; then echo 'ollama not ready' >&2; exit 1; fi;
        sleep 2;
      done;
      ollama pull $${OLLAMA_MODEL:-qwen2.5:1.5b}
      "
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    networks:
      - internal
    restart: "no"

  # Nightly pg_dump into the postgres_backups volume (see docs/runbook.md).
  postgres-backup:
    image: pgvector/pgvector:pg17
    container_name: newscrawl-postgres-backup
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - ./infrastructure/postgres/backup.sh:/backup.sh:ro
      - postgres_backups:/backups
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

networks:
  internal:
    name: newscrawl_internal
  traefik_proxy:
    external: true

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  minio_data:
  hf_cache:
  ollama_data:

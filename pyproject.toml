[project]
name = "newscrawl-platform"
version = "0.1.0"
description = "NewsCrawl Intelligence Platform - distributed multilingual news crawling and intelligence platform"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/crawler",
    "apps/processor",
    "packages/contracts",
    "packages/crawler-utils",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "types-python-dateutil",
    "testcontainers[postgres,redis]>=4.10",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["apps/web", "traefik", "site"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "ASYNC",# flake8-async
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert allowed (pytest)
    "B008",  # function call in default arg (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "ASYNC"]
# Alembic-generated files: long lines and odd whitespace come from autogenerate
"**/migrations/versions/*" = ["E501", "W291"]
"**/migrations/**" = ["I"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["apps/web", "traefik", "site", "build", "dist"]

[[tool.mypy.overrides]]
module = [
    "scrapy.*",
    "scrapy_playwright.*",
    "twisted.*",
    "boto3.*",
    "botocore.*",
    "feedparser.*",
    "simhash.*",
    "selectolax.*",
    "langdetect.*",
    "sentence_transformers.*",
    "testcontainers.*",
]
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "apps/api/tests",
    "apps/crawler/tests",
    "apps/processor/tests",
    "packages/contracts/tests",
    "packages/crawler-utils/tests",
]
markers = [
    "integration: tests requiring live PostgreSQL/Redis (deselect with '-m \"not integration\"')",
    "e2e: full end-to-end pipeline tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:twisted.*",
]

[project]
name = "newscrawl-processor"
version = "0.1.0"
description = "NewsCrawl processing plane: cleaning, language detection, dedup, LLM extraction, embeddings"
requires-python = ">=3.14"
dependencies = [
    "redis>=6.2",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30",
    "pgvector>=0.4",
    "aioboto3>=13.2",
    "selectolax>=0.3.35",
    "httpx>=0.28",
    "structlog>=25.4",
    "prometheus-client>=0.22",
    "newscrawl-api",
    "newscrawl-contracts",
    "newscrawl-crawler-utils",
    "google-genai>=2.14.0",
    "sentence-transformers>=5.6.0",
]

[tool.uv.sources]
newscrawl-api = { workspace = true }
newscrawl-contracts = { workspace = true }
newscrawl-crawler-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newscrawl_processor"]

[project]
name = "newscrawl-api"
version = "0.1.0"
description = "NewsCrawl control & query plane: FastAPI application, domain models, and frontier services"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pgvector>=0.4",
    "redis>=6.2",
    "structlog>=25.4",
    "prometheus-client>=0.22",
    "pyjwt>=2.10",
    "argon2-cffi>=25.1",
    "httpx>=0.28",
    "orjson>=3.10",
    "newscrawl-contracts",
    "newscrawl-crawler-utils",
]

[tool.uv.sources]
newscrawl-contracts = { workspace = true }
newscrawl-crawler-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newscrawl_api"]

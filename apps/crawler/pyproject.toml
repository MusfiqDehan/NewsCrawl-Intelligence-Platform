[project]
name = "newscrawl-crawler"
version = "0.1.0"
description = "NewsCrawl crawl plane: Scrapy spiders, middlewares, pipelines, and Playwright fallback"
requires-python = ">=3.14"
dependencies = [
    "scrapy>=2.17",
    "scrapy-playwright>=0.0.47",
    "playwright>=1.53",
    "parsel>=1.10",
    "lxml>=5.4",
    "selectolax>=0.3.35",
    "feedparser>=6.0.11",
    "redis>=6.2",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30",
    "boto3>=1.38",
    "structlog>=25.4",
    "prometheus-client>=0.22",
    "newscrawl-api",
    "newscrawl-contracts",
    "newscrawl-crawler-utils",
]

[tool.uv.sources]
newscrawl-api = { workspace = true }
newscrawl-contracts = { workspace = true }
newscrawl-crawler-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newscrawl_crawler"]
